<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="towGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#towGlow)"/>
  <!-- Two elevated metal towers -->
  <rect x="25" y="80" width="30" height="90" fill="#334155" stroke="#64748B" stroke-width="2"/>
  <rect x="145" y="80" width="30" height="90" fill="#334155" stroke="#64748B" stroke-width="2"/>
  <!-- Center gap guillotine / drop blade line -->
  <line x1="100" y1="85" x2="100" y2="170" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Heavy Rope across towers -->
  <path d="M25 100 Q100 115 170 100" stroke="#D97706" stroke-width="7" stroke-linecap="round"/>
  <circle cx="100" cy="107" r="6" fill="#FBBF24" stroke="#78350F" stroke-width="2"/>
</svg>
