<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="bridgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0A1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#bridgeGlow)"/>
  <!-- Steel Beams -->
  <line x1="30" y1="40" x2="30" y2="160" stroke="#475569" stroke-width="6"/>
  <line x1="170" y1="40" x2="170" y2="160" stroke="#475569" stroke-width="6"/>
  <!-- Glass Stepping Panels -->
  <rect x="45" y="50" width="45" height="30" rx="4" fill="url(#glassGrad)" stroke="#22D3EE" stroke-width="2"/>
  <rect x="110" y="50" width="45" height="30" rx="4" fill="url(#glassGrad)" stroke="#22D3EE" stroke-width="2"/>
  <rect x="45" y="95" width="45" height="30" rx="4" fill="url(#glassGrad)" stroke="#22D3EE" stroke-width="2"/>
  <rect x="110" y="95" width="45" height="30" rx="4" fill="url(#glassGrad)" stroke="#34D399" stroke-width="3"/>
  <rect x="45" y="140" width="45" height="30" rx="4" fill="url(#glassGrad)" stroke="#22D3EE" stroke-width="2"/>
  <rect x="110" y="140" width="45" height="30" rx="4" fill="url(#glassGrad)" stroke="#22D3EE" stroke-width="2"/>
  <!-- Neon step numbers -->
  <text x="67" y="70" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="132" y="70" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="67" y="115" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="132" y="115" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#34D399">4 ✓</text>
</svg>
